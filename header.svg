<svg xmlns="http://www.w3.org/2000/svg" width="920" height="252" viewBox="0 0 920 252" role="img" aria-label="maanas pabbathi — economics, drawn to scale.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="55%" stop-color="#58d6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>

    <linearGradient id="rule" x1="-0.5" y1="0" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58d6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.6;0.4;-0.6" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;1.4;0.4" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <mask id="mName">
      <rect x="0" y="0" width="920" height="252" fill="#000"/>
      <rect x="28" y="72" width="440" height="70" fill="#fff">
        <animate attributeName="width" from="0" to="440" dur="0.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.15 0.85 0.25 1"/>
      </rect>
    </mask>

    <mask id="mCmd">
      <rect x="0" y="0" width="920" height="252" fill="#000"/>
      <rect x="28" y="158" width="462" height="48" fill="#fff">
        <animate attributeName="width" from="0" to="462" dur="1.3s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      </rect>
    </mask>
  </defs>

  <rect x="8" y="8" width="904" height="236" rx="14" fill="#0d1117" stroke="#30363d"/>
  <path d="M8 22 a14 14 0 0 1 14 -14 h876 a14 14 0 0 1 14 14 v26 h-904 z" fill="#161b22"/>
  <line x1="8" y1="48" x2="912" y2="48" stroke="#21262d"/>
  <circle cx="34" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="56" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="78" cy="28" r="6" fill="#27c93f"/>
  <text x="460" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7d8590">maanas@github — zsh</text>

  <g mask="url(#mName)">
    <text x="28" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="46" font-weight="700" fill="#e6edf3">maanas pabbathi</text>
  </g>

  <g mask="url(#mCmd)">
    <text x="28" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="url(#accent)">$ economics, drawn to scale.</text>
  </g>

  <rect x="492" y="172" width="11" height="27" fill="#7ee787">
    <animate attributeName="x" from="30" to="492" dur="1.3s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="2.5s" keyTimes="0;0.5;0.5;1" repeatCount="indefinite"/>
  </rect>

  <rect x="28" y="218" width="864" height="1.5" fill="url(#rule)"/>
</svg>
